general {
    hide_cursor = true
    grace = 2
    no_fade_in = true
}

# Per-theme colors are overridden by setup-rice.sh in current-theme.conf
$bg = rgba(fbf1c7ff)
$fg = rgba(3c3836ff)
$accent = rgba(b57614ff)
$muted = rgba(7c6f64ff)

source = ~/.config/hypr/current-theme-hyprlock.conf

background {
    monitor =
    color = $bg
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $fg
    font_size = 96
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $muted
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 1
    inner_color = $bg
    outer_color = $muted
    check_color = $accent
    fail_color = rgba(fb4934ff)
    font_color = $fg
    fade_on_empty = false
    placeholder_text = password
    rounding = 2
    position = 0, -100
    halign = center
    valign = center
}
