add_newline = false
format = """$directory$character"""
palette = "mono"
right_format = """$all"""
command_timeout = 1000

[directory]
style = "bold secondary"

[character]
success_symbol = "[❯](primary)"
error_symbol   = "[❯](error)"

[git_branch]
style  = "success"
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style      = "success"
staged     = "[+](success)"
modified   = "[!](warning)"
deleted    = "[-](error)"
conflicted = "[~](error)"
untracked  = "[?](subtle)"

[cmd_duration]
style = "warning"

