add_newline = false
format = """$directory$character"""
palette = "md-paper"
right_format = """$all"""
command_timeout = 1000

[directory]
style = "bold secondary"

[character]
success_symbol = "[❯](primary)"
error_symbol   = "[❯](error)"

[git_branch]
style  = "success"
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style      = "success"
staged     = "[+](success)"
modified   = "[!](warning)"
deleted    = "[-](error)"
conflicted = "[~](error)"
untracked  = "[?](subtle)"

[cmd_duration]
style = "warning"

[palettes.md-paper]
# Standard names — picked up by module defaults automatically
red    = "#C4607A"
green  = "#8BAD79"
yellow = "#B89868"
blue   = "#6B9AB8"
purple = "#58534C"
cyan   = "#4E4A45"
# Semantic aliases used in explicit module styles above
primary   = "#6B9AB8"
secondary = "#58534C"
success   = "#8BAD79"
warning   = "#B89868"
error     = "#C4607A"
subtle    = "#857F78"
