add_newline = false
format = """$directory$character"""
palette = "eink"
right_format = """$all"""
command_timeout = 1000

[directory]
style = "bold secondary"

[character]
success_symbol = "[❯](primary)"
error_symbol   = "[❯](error)"

[git_branch]
style  = "git"
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style      = "git"
staged     = "[+](git)"
modified   = "[!](warning)"
deleted    = "[-](error)"
conflicted = "[~](error)"
untracked  = "[?](subtle)"

[cmd_duration]
style = "warning"

